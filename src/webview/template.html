<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        img-src {{cspSource}} https: data:;
        style-src {{cspSource}} 'unsafe-inline' https://cdnjs.cloudflare.com;
        script-src {{cspSource}} https://cdnjs.cloudflare.com;
        font-src {{cspSource}};
    ">
    <link rel="stylesheet" href="{{katexCssUri}}">
    <link rel="stylesheet" href="{{cssUri}}">
    <link id="hljs-theme" rel="stylesheet" href="{{themeUrl}}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>


<body data-rules="{{highlightRules}}">
    <div class="edit-hint">{{hintText}}</div>
    <div id="vjs-nav" class="vjs-nav hidden">
        <button id="vjs-prev">↑</button>
        <span id="vjs-counter">0 / 0</span>
        <button id="vjs-next">↓</button>
    </div>
    {{content}}

    {{warning}}

    <script src="{{scriptUri}}"></script>
</body>

</html>
